<script>
const SRC="<!doctype html>"+document.documentElement.outerHTML,$=s=>document.querySelector(s),KEY="adventskalender-v5",EMB=document.getElementById("adv-data"),VIEW=!!EMB;
const SH={square:"M10 10H90V90H10Z",round:"M28 10H72Q90 10 90 28V72Q90 90 72 90H28Q10 90 10 72V28Q10 10 28 10Z",circle:"M50 6A44 44 0 1 1 49.9 6Z",star:"M50 4L62 37H96L68 58L79 93L50 72L21 93L32 58L4 37H38Z",heart:"M50 90C10 62 2 36 22 20C36 10 46 18 50 28C54 18 64 10 78 20C98 36 90 62 50 90Z",tree:"M50 3L72 34H60L82 60H66L90 86H56V97H44V86H10L34 60H18L40 34H28Z",snow:"M50 2L58 30L82 14L70 40L98 50L70 60L82 86L58 70L50 98L42 70L18 86L30 60L2 50L30 40L18 14L42 30Z",hex:"M26 8H74L98 50L74 92H26L2 50Z",gift:"M10 28H90V92H10Z M6 14H94V30H6Z",triangle:"M50 8L94 90H6Z",diamond:"M50 4L96 50L50 96L4 50Z",pentagon:"M50 4L96 38L78 94H22L4 38Z",octagon:"M30 6H70L94 30V70L70 94H30L6 70V30Z",plus:"M36 6H64V36H94V64H64V94H36V64H6V36H36Z",arrow:"M6 36H56V10L96 50L56 90V64H6Z",moon:"M62 6A44 44 0 1 0 94 66A36 36 0 0 1 62 6Z",bell:"M50 6C70 6 78 24 78 44V62L92 80H8L22 62V44C22 24 30 6 50 6Z",cloud:"M26 78A20 20 0 0 1 24 38A26 26 0 0 1 74 32A22 22 0 0 1 76 78Z",bolt:"M58 4L16 56H44L36 96L84 40H54Z"};
const NM={square:"Quadrat",circle:"Kreis",star:"Stern",heart:"Herz",tree:"Baum",snow:"Schneeflocke",hex:"Sechseck",round:"Rechteck",gift:"Geschenk",triangle:"Dreieck",diamond:"Raute",pentagon:"Fünfeck",octagon:"Achteck",plus:"Kreuz",arrow:"Pfeil",moon:"Mond",bell:"Glocke",cloud:"Wolke",bolt:"Blitz",custom:"Eigene Form"};
const TPL={classic:{n:"Klassisch",c:["#b3202f","#1f6b3a","#d9a73d"],sky:["#0b1a3a","#2b1030"],sh:["square","circle","star","heart","tree","snow"],f:"Georgia,serif",b:"#f0c060"},
modern:{n:"Modern",c:["#1aa6d8","#8a5cf0","#f06a9a"],sky:["#050a22","#112a5a"],sh:["round","hex","circle","star"],f:"system-ui,sans-serif",b:"#7be0ff"},
minimal:{n:"Minimalistisch",c:["#e8edf2","#c8d2dc"],sky:["#1d2733","#2c3a4a"],sh:["square","round"],f:"system-ui,sans-serif",b:"#ffffff"},
forest:{n:"Winterwald",c:["#1f6b3a","#2b8a52","#b3202f"],sky:["#06202a","#0e3b3a"],sh:["tree","circle","snow","star"],f:"Georgia,serif",b:"#cfe8d8"},
round:{n:"Rund & Elegant",c:["#8b1c2c","#c99a3c"],sky:["#1a0b24","#3a1a3a"],sh:["circle"],f:"Georgia,serif",b:"#f4d58d"},
custom:{n:"Individuell",c:["#b3202f"],sky:["#0b1a3a","#2b1030"],sh:["square"],f:"Georgia,serif",b:"#f0c060"}};
let BK="",PV=0,S,sel=null,tab="el",nav="doors",zoom=1,uid=1;
const id=()=>"i"+Date.now().toString(36)+(uid++);
function fresh(){const t=TPL.classic,d=[];for(let i=0;i<24;i++){d.push({id:id(),n:i+1,shape:t.sh[i%t.sh.length],x:110+(i%8)*140,y:270+Math.floor(i/8)*125,size:92,color:t.c[i%t.c.length],border:t.b,bw:3,op:1,vis:1,title:"Türchen "+(i+1),unlock:new Date().getFullYear()+"-12-"+String(i+1).padStart(2,"0"),desc:"",ctype:"text",url:"",img:"",pts:"50,5 95,40 78,95 22,95 5,40",anim:[],dur:.7,delay:0,fs:34,fc:"#fff"})}
return{name:"Mein Adventskalender",tpl:"classic",sky:t.sky,bgs:[],bg:"default",doors:d,texts:[{id:id(),text:"Frohe Weihnachten",x:600,y:95,size:64,color:"#f0c060",font:"Georgia,serif",it:1,b:0,align:"center",shadow:1},{id:id(),text:"Öffne jeden Tag ein neues Türchen und lass dich überraschen!",x:600,y:158,size:18,color:"#fff",font:"system-ui,sans-serif",it:0,b:0,align:"center",shadow:1}]}}
function load(){try{S=JSON.parse(localStorage[KEY])}catch(e){S=fresh()}}
function save(m){try{localStorage[KEY]=JSON.stringify({...S,bgs:S.bgs.filter(m=>!m.session)});if(m)toast("Gespeichert im Browser.")}catch(e){toast("Speicher voll – bitte Projekt als JSON exportieren (große Bilder).")}}
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#0e3b4a;border:1px solid var(--cy);padding:10px 16px;border-radius:9px;z-index:99";document.body.append(e);setTimeout(()=>e.remove(),2600)}
const find=i=>S.doors.find(d=>d.id===i)||S.texts.find(t=>t.id===i);
/* Landschaft (SVG, stilisiert) */
function scene(){let r=n=>(Math.sin(n*9301+49297)*233280)%1,s="";const [a,b]=S.sky;
s+=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><radialGradient id="gl"><stop offset="0" stop-color="#ffc060" stop-opacity=".55"/><stop offset="1" stop-color="#ffc060" stop-opacity="0"/></radialGradient></defs><rect width="800" height="760" fill="url(#sk)"/>`;
for(let i=0;i<90;i++){s+=`<circle cx="${Math.abs(r(i)*800)}" cy="${Math.abs(r(i+99)*420)}" r="${.6+Math.abs(r(i+5))*1.6}" fill="#fff" opacity="${.35+Math.abs(r(i+9))*.6}"/>`}
s+=`<path d="M0 520Q200 450 400 500T800 470V760H0Z" fill="#c9d8ee" opacity=".9"/>`;
for(let i=0;i<7;i++){const x=20+i*115+Math.abs(r(i+3))*30,y=470+Math.abs(r(i+7))*40;s+=`<ellipse cx="${x+30}" cy="${y+30}" rx="90" ry="60" fill="url(#gl)"/><rect x="${x}" y="${y}" width="64" height="44" fill="#4a2e22"/><path d="M${x-8} ${y}L${x+32} ${y-34}L${x+72} ${y}Z" fill="#e9f1fb"/><rect x="${x+10}" y="${y+12}" width="14" height="14" fill="#ffc45a"/><rect x="${x+38}" y="${y+12}" width="14" height="14" fill="#ffb040"/>`}
for(let i=0;i<16;i++){const x=Math.abs(r(i+20))*800,y=560+Math.abs(r(i+30))*190,h=60+Math.abs(r(i+40))*70;s+=`<path d="M${x} ${y-h}L${x+h*.3} ${y-h*.4}H${x+h*.18}L${x+h*.4} ${y}H${x-h*.4}L${x-h*.18} ${y-h*.4}H${x-h*.3}Z" fill="#0e4a30"/><path d="M${x} ${y-h}L${x+h*.14} ${y-h*.68}H${x-h*.14}Z" fill="#e9f1fb"/><circle cx="${x}" cy="${y-h*.5}" r="2.4" fill="#ffd070"/>`}
s+=`<path d="M0 700Q300 640 800 700V760H0Z" fill="#e6effa"/>`;return s}
/* Rendering */
function doorSVG(d){const ps=d.ps||1,t=d.pathd?`<path d="${d.pathd}" transform="${d.pathT}" `:d.shape==="custom"?`<polygon points="${d.pts}" `:`<path d="${SH[d.shape]||SH.square}" `;const f=d.nofill?"none":d.img?`url(#p${d.id})`:`url(#g${d.id})`;
return`<svg viewBox="0 0 100 100"><defs><linearGradient id="g${d.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${d.color}"/><stop offset="1" stop-color="${shade(d.color,-.45)}"/></linearGradient>${d.img?`<pattern id="p${d.id}" width="1" height="1"><image href="${d.img}" width="100" height="100" preserveAspectRatio="xMidYMid slice"/></pattern>`:""}</defs>${t}fill="${f}" stroke="${d.bw?d.border:"none"}" stroke-width="${d.bw/ps}" stroke-dasharray="${d.dash==="d"?"8 4":d.dash==="o"?"1 5":"none"}" stroke-linecap="round" fill-opacity="${d.op}" stroke-linejoin="round" fill-rule="evenodd"/>${d.shape==="gift"?`<path d="M50 14V92M10 56H90" stroke="${d.border}" stroke-width="5"/>`:""}${d.deco?"":`<text x="50" y="${d.shape==="tree"?66:58}" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${d.fs}" fill="${d.fc}" style="paint-order:stroke" stroke="#0008" stroke-width="2">${d.n}</text>`}</svg>`}
function shade(h,p){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=c=>Math.max(0,Math.min(255,Math.round(c*(1+p))));return"#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function bgHTML(){const m=S.bgs.find(x=>x.id===S.bg);return m?(m.type==="video"?`<video id="bgl" src="${vsrc(m)}" autoplay muted loop playsinline></video>`:`<img id="bgl" src="${m.src}" alt="">`):`<svg id="bgl" viewBox="0 260 800 450" preserveAspectRatio="xMidYMid slice">${scene()}</svg>`}
function render(){const st=$("#stage");const bk=S.bg+S.sky+S.bgs.length;if(bk!==BK){BK=bk;$("#bgw").innerHTML=bgHTML()}let h="";
for(const t of S.texts)h+=`<div class="it txt ${sel===t.id?"sel":""}" data-id="${t.id}" style="left:${t.x}px;top:${t.y}px;transform:translate(-50%,-50%);width:max-content;max-width:92%;font:${t.it?"italic ":""}${t.b?"700 ":""}${t.size}px ${t.font};color:${t.color};text-align:${t.align};text-shadow:${t.shadow?"0 3px 14px #000":"none"}">${esc(t.text)}</div>`;
for(const d of S.doors){if(!d.vis&&sel!==d.id)continue;h+=`<div class="it ${sel===d.id?"sel":""}" data-id="${d.id}" style="left:${d.x-d.size/2}px;top:${d.y-d.size/2}px;width:${d.size}px;height:${d.size}px;opacity:${d.vis?(VIEW&&d.n&&!isOpen(d)?.72:1):.3};transform:rotate(${d.rot||0}deg)">${doorSVG(d)}${VIEW&&d.n&&!isOpen(d)?'<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:28px;text-shadow:0 2px 6px #000">🔒</div>':""}${sel===d.id?`<div class="pill"><button data-a="dup">⧉</button><button data-a="del">🗑</button></div><div class="hd" data-h="1" style="right:-6px;bottom:-6px;cursor:nwse-resize"></div>`:""}</div>`}
$("#its").innerHTML=h;const tt=S.texts.find(t=>t.id===sel);if(tt){const e=st.querySelector(`[data-id="${sel}"]`);if(e)e.insertAdjacentHTML("beforeend",`<div class="pill"><button data-a="dup">⧉</button><button data-a="del">🗑</button></div>`)}
media();}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Drag / Resize */
let drag=null;
$("#stage").addEventListener("pointerdown",e=>{if(PV){const el=e.target.closest(".it"),d=el&&find(el.dataset.id);if(d&&d.n)openDoor(d);return}const a=e.target.closest("[data-a]");if(a){act(a.dataset.a);return}const el=e.target.closest(".it");if(!el){sel=null;render();panel();return}const o=find(el.dataset.id);sel=o.id;drag={o,rs:!!e.target.dataset.h,x:e.clientX,y:e.clientY,ox:o.x,oy:o.y,os:o.size};e.target.setPointerCapture?.(e.pointerId);render();panel()});
addEventListener("pointermove",e=>{if(!drag)return;const dx=(e.clientX-drag.x)/zoom,dy=(e.clientY-drag.y)/zoom;if(drag.rs)drag.o.size=Math.max(30,Math.min(220,Math.round(drag.os+Math.max(dx,dy)*2)));else{drag.o.x=Math.round(drag.ox+dx);drag.o.y=Math.round(drag.oy+dy)}render();sync()});
addEventListener("pointerup",()=>{if(drag){drag=null;save();panel()}});
function act(a){const o=find(sel);if(!o)return;if(a==="del"){S.doors=S.doors.filter(d=>d!==o);S.texts=S.texts.filter(t=>t!==o);sel=null}if(a==="dup"){const c=JSON.parse(JSON.stringify(o));c.id=id();c.x+=24;c.y+=24;if(o.shape){if(o.n){c.n=Math.max(...S.doors.map(d=>d.n))+1;c.title="Türchen "+c.n}S.doors.push(c)}else S.texts.push(c);sel=c.id}save();render();panel()}
/* Panels */
const NAVS=[["design","✎","Design"],["elements","▦","Elemente"],["doors","🎁","Türchen"],["bg","🖼","Hintergrund"],["set","⚙","Einstellungen"]];

return`<h2>Animation beim Öffnen</h2><p class="m">Reihenfolge = Reihenfolge des Anklickens.</p>${["pop:Aufpoppen","fade:Sanftes Einblenden","flip:Umdrehen","glow:Goldenes Leuchten","bounce:Hüpfen","spin:Drehen","zoom:Zoom","shake:Schütteln"].map(s=>{const[k,n]=s.split(":"),i=d.anim.indexOf(k);return`<label style="color:var(--tx)"><input type="checkbox" data-an="${k}" ${i>=0?"checked":""} style="width:auto"> ${n}${i>=0?" · "+(i+1):""}</label>`}).join("")}<label>Dauer je Effekt (s)</label><input data-k="dur" type="number" step=".1" min=".2" value="${d.dur}"><label>Verzögerung (s)</label><input data-k="delay" type="number" step=".1" min="0" value="${d.delay}"><button style="width:100%;margin-top:14px" data-a2="play">▶ Abspielen</button><div class="note">Vorschau im Editor. Auf der öffentlichen Seite folgt die Übernahme in Schritt 3.</div>`}

function add(w){if(w==="dates"){const y=prompt("Jahr der Freischaltung:",new Date().getFullYear());if(!y)return;S.doors.filter(d=>d.n).forEach(d=>d.unlock=d.n<=31?y+"-12-"+String(d.n).padStart(2,"0"):"");save();panel();toast("Freischaltdaten gesetzt (Tür 1 = 1. Dezember usw.).");return}if(w==="shape")return $("#fileShape").click();if(w==="bgimg")return $("#fileBg").click();if(w==="bgvid")return $("#fileVid").click();if(w==="bgurl"){const u=prompt("Video-URL (MP4/WebM):");if(u){const m={id:id(),src:u,type:"video"};S.bgs.push(m);S.bg=m.id;save();render()}return}if(w==="door"){const n=Math.max(0,...S.doors.map(d=>d.n))+1,t=TPL[S.tpl],d=JSON.parse(JSON.stringify(S.doors.find(d=>d.n)||fresh().doors[0]));Object.assign(d,{id:id(),n,title:"Türchen "+n,unlock:n<=31?new Date().getFullYear()+"-12-"+String(n).padStart(2,"0"):"",x:600,y:340,anim:[],img:"",vis:1});S.doors.push(d);sel=d.id}
if(w==="text"||w==="btn"){const t={id:id(),text:w==="btn"?"Hier klicken":"Neuer Text",x:600,y:340,size:22,color:"#fff",font:"system-ui,sans-serif",it:0,b:w==="btn"?1:0,align:"center",shadow:1};S.texts.push(t);sel=t.id}

if(w==="new"&&confirm("Neues Projekt anlegen? Nicht exportierte Änderungen gehen verloren.")){S=fresh();sel=null}

save();render();panel();toolsR()}
function act2(a){const o=find(sel);if(a==="cimg")return $("#fileCont").click();if(a==="cclr"){o.url="";save();panel();return}if(a==="del")act("del");if(a==="img"){$("#fileImg").click()}if(a==="noimg"){o.img="";save();render()}if(a==="play")play(o)}
const KF={pop:[{transform:"scale(.4)"},{transform:"scale(1.2)"},{transform:"scale(1)"}],fade:[{opacity:0},{opacity:1}],flip:[{transform:"rotateY(180deg)"},{transform:"rotateY(0)"}],glow:[{filter:"drop-shadow(0 0 0 #f0c060)"},{filter:"drop-shadow(0 0 22px #ffd56a)"},{filter:"drop-shadow(0 0 0 #f0c060)"}],bounce:[{transform:"translateY(0)"},{transform:"translateY(-26px)"},{transform:"translateY(0)"}],spin:[{transform:"rotate(0)"},{transform:"rotate(360deg)"}],zoom:[{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],shake:[{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}]};
